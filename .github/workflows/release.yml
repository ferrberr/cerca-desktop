name: Build and release Cerca
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: cerca-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build installers
        run: npm run dist:${{ matrix.platform }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test packaged Linux application
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:package
      - name: Test packaged Windows application
        if: runner.os == 'Windows'
        run: npm run test:package
      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/*-setup.exe | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP 'Cerca-installed-test'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S /D=$destination" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          node scripts/test-package.js "$destination/cerca.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed app smoke test failed' }
      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*-setup.exe
      - name: Upload packaged application checks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-check-${{ matrix.platform }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            dist/package-smoke-*.json
            dist/package-smoke-*.png
  publish:
    name: Publish downloads
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist
      - name: Publish complete release with SHA256 checksums
        run: node scripts/publish-release.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
